# 官方 postgres 镜像没有 conf.d 自动加载机制，此文件挂载到独立路径，
# 由启动参数指定为主配置，未显式指定的参数均按编译期默认值生效。
# 注意不能直接挂进数据目录覆盖同名文件：首次初始化时 initdb 要求
# 数据目录为空，目录里预先有文件会初始化失败

# 主配置挪出数据目录后，以下三项的默认路径会跟着配置文件所在目录走，
# 必须显式钉回数据目录，否则服务找不到集群数据和访问控制规则
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

# 放行外部连接（否则默认只监听 localhost）；entrypoint 只往数据目录里
# 自动追加此项，主配置被替换后必须在此显式声明
listen_addresses = '*'

# ---------- 以下为 Debezium CDC 所需配置 ----------

# 开启逻辑复制，wal 流中带上行级变更的前后镜像，CDC 的数据来源
# 默认值 replica 只保留物理复制所需的信息，无法解析出行变更
wal_level = logical

# WAL 发送进程上限，每个逻辑复制槽占用一个 sender（物理备库也计入）
max_wal_senders = 10

# 复制槽数量上限，每个 Debezium connector 占用一个槽
# 槽会阻止 WAL 被清理，connector 停用后记得及时删除对应槽，否则磁盘会被撑满
max_replication_slots = 10
