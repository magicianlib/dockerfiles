# 官方 postgres 镜像没有 conf.d 自动加载机制，此文件会直接覆盖
# 数据目录里的主配置文件，未显式指定的参数均按编译期默认值生效。

# 镜像 entrypoint 首次初始化时会检查此项以放行外部连接（否则默认只监听 localhost），
# 覆盖主配置文件后 entrypoint 不再自动追加，必须显式声明
listen_addresses = '*'

# ---------- 以下为 Debezium CDC 所需配置 ----------

# 开启逻辑复制，wal 流中带上行级变更的前后镜像，CDC 的数据来源
# 默认值 replica 只保留物理复制所需的信息，无法解析出行变更
wal_level = logical

# WAL 发送进程上限，每个逻辑复制槽占用一个 sender（物理备库也计入）
max_wal_senders = 10

# 复制槽数量上限，每个 Debezium connector 占用一个槽
# 槽会阻止 WAL 被清理，connector 停用后记得及时删除对应槽，否则磁盘会被撑满
max_replication_slots = 10
