services:
    postgres:
        image: postgres:17.6
        container_name: postgres
        restart: always
        # 开启逻辑复制（供 Debezium 等 CDC 使用）；slots/senders 数量按连接器数量调整
        command: >
          postgres
          -c wal_level=logical
          -c max_wal_senders=10
          -c max_replication_slots=10
        environment:
            TZ: Asia/Shanghai
            POSTGRES_DB: db # 额外创建一个自定义数据库(默认 postgres 数据库依然存在)
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin123
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
        ports:
            - "5432:5432"
        volumes:
            - ./data:/var/lib/postgresql/data
