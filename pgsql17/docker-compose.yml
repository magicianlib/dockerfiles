services:
    postgres:
        image: postgres:17.6
        container_name: postgres
        # restart: always
        environment:
            TZ: Asia/Shanghai
            POSTGRES_DB: shop # 额外创建一个自定义数据库(默认 postgres 数据库依然存在)
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin123
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
        ports:
            - "5432:5432"
        volumes:
            - ./data:/var/lib/postgresql/data
            # 逻辑复制等配置（供 Debezium 等 CDC 使用）。
            # 官方镜像没有 conf.d 自动加载机制，直接覆盖数据目录里的主配置文件，
            # 未指定的参数均按编译期默认值生效
            - ./conf/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
